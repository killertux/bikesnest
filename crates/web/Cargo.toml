[package]
name = "bikesnest-web"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
askama = { workspace = true }
# `multipart` on top of the workspace feature set: the photo upload endpoint.
axum = { workspace = true, features = ["multipart"] }
bikesnest-application = { workspace = true }
bikesnest-domain = { workspace = true }
# `axum`: makes `Locale` a request extractor (web-only concern).
bikesnest-i18n = { workspace = true, features = ["axum"] }
bikesnest-infrastructure = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
dotenvy = "0.15"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content-hashed static asset manifest: first 10 hex chars of each file's
# SHA-256, computed once at startup.
sha2 = "0.11.0"
rand = "0.8"
# `signal` on top of the workspace feature set: SIGTERM/SIGINT graceful shutdown.
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
bikesnest-test-support = { workspace = true }
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex = "1"
sqlx = { workspace = true }
