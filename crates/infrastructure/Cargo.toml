[package]
name = "bikesnest-infrastructure"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.5"
async-trait = { workspace = true }
aws-config = "1.11.0"
aws-credential-types = "1.3.0"
# The generated SDK's default `rustls` feature selects its legacy Hyper 0.14 /
# rustls 0.21 connector in addition to the maintained default HTTPS client.
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-smithy-types = "1.6.2"
bikesnest-application = { workspace = true }
bikesnest-domain = { workspace = true }
# The message catalog: transactional emails are rendered here, in the
# recipient's stored locale (no axum feature — this layer has no requests).
bikesnest-i18n = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
cron = "0.12"
hmac = "0.13.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "tokio1", "builder"] }
rand = "0.8"
redis = { version = "1.6.0", features = ["aio", "cluster-async", "tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.11.0"
# `json` on top of the workspace feature set: the job queue stores payloads as JSONB.
sqlx = { workspace = true, features = ["json"] }
thiserror = { workspace = true }
# `fs` on top of the workspace feature set: the dev e-mail outbox writes files.
# `sync` for the image-processing semaphore, `time` for the worker poll sleep.
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
bikesnest-test-support = { workspace = true }
