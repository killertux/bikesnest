[package]
name = "bikesnest-application"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = "0.22"
bikesnest-domain = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
# Keyset cursors must preserve the exact SQL float8 sort key across JSON.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = "1"
tokio = { workspace = true }
