name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://bikesnest:bikesnest@localhost:5432/bikesnest
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: bikesnest
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      VALKEY_URL: valkey://localhost:6379
      CSP_MEDIA_HOSTS: http://localhost:9000
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_REGION: us-east-1
      S3_TEST_BUCKET: bikesnest
      S3_TEST_ACCESS_KEY_ID: minioadmin
      S3_TEST_SECRET_ACCESS_KEY: minioadmin
      VALKEY_TEST_URL: valkey://localhost:6379
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: bikesnest
          POSTGRES_PASSWORD: bikesnest
          POSTGRES_DB: bikesnest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bikesnest -d bikesnest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO did not become healthy in time"
          exit 1
      - name: Create test bucket
        run: |
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/bikesnest"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace --locked

  frontend-assets:
    name: Frontend assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild generated assets
        run: |
          npm run build:assets
          npm run build:css
      - name: Check generated assets are committed
        run: git diff --exit-code -- web/static/css/app.css web/static/vendor

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t bikesnest .
      - name: Reject an incomplete production environment
        run: |
          set +e
          docker run --rm \
            -e APP_ENV=production \
            -e DATABASE_URL=postgres://x:x@localhost:1/x \
            bikesnest serve
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::the production image accepted an incomplete environment"
            exit 1
          fi
