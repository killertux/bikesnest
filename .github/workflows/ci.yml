name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  advisory-checks:
    name: Advisory checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned RustSec scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Test advisory-report validation
        run: node scripts/verify-advisories.test.cjs
      - name: Check RustSec advisories
        shell: bash
        run: |
          set +e
          cargo audit --json > /tmp/cargo-audit.json
          scan_status=$?
          set -e
          node scripts/verify-advisories.cjs \
            --ecosystem rustsec \
            --report /tmp/cargo-audit.json \
            --scanner-exit "$scan_status"
      - name: Check npm advisories
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          scan_status=$?
          set -e
          node scripts/verify-advisories.cjs \
            --ecosystem npm \
            --report /tmp/npm-audit.json \
            --scanner-exit "$scan_status"

  db-free-tests:
    name: DB-free tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Compile DB-free test binaries (warm CI cache when restored)
        run: time cargo test -p bikesnest-domain -p bikesnest-application --no-run --locked
      - name: Execute DB-free tests (after this runner's compile phase)
        run: time cargo test -p bikesnest-domain -p bikesnest-application --locked

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgres://bikesnest_test:bikesnest_test@localhost:5432/bikesnest_test_ci
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: bikesnest
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      VALKEY_URL: valkey://localhost:6379
      CSP_MEDIA_HOSTS: http://localhost:9000
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_REGION: us-east-1
      S3_TEST_BUCKET: bikesnest
      S3_TEST_ACCESS_KEY_ID: minioadmin
      S3_TEST_SECRET_ACCESS_KEY: minioadmin
      VALKEY_TEST_URL: valkey://localhost:6379
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: bikesnest_test
          POSTGRES_PASSWORD: bikesnest_test
          POSTGRES_DB: bikesnest_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bikesnest_test -d bikesnest_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO did not become healthy in time"
          exit 1
      - name: Create test bucket
        run: |
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/bikesnest"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ignored-browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Visually check rendered email in Chromium
        run: env -u BIKESNEST_BROWSER_MUTANT cargo test -p bikesnest-infrastructure --test email_renderer_visual_test --locked -- --ignored
      - name: Test rendered contribution journey in Chromium
        run: env -u BIKESNEST_BROWSER_MUTANT cargo test -p bikesnest-web --test contribution_browser_test --locked -- --ignored
      - name: Test rendered CSRF lifecycle in Chromium
        run: env -u BIKESNEST_BROWSER_MUTANT cargo test -p bikesnest-web --test csrf_browser_test --locked -- --ignored
      - name: Test rendered policy journey in Chromium
        run: env -u BIKESNEST_BROWSER_MUTANT cargo test -p bikesnest-web --test policy_browser_test --locked -- --ignored
      - name: Test rendered profile journey in Chromium
        run: env -u BIKESNEST_BROWSER_MUTANT cargo test -p bikesnest-web --test profile_browser_test --locked -- --ignored
      - name: Test rendered search synchronization in Chromium
        run: env -u BIKESNEST_BROWSER_MUTANT cargo test -p bikesnest-web --test search_browser_test --locked -- --ignored

  frontend-assets:
    name: Frontend assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild generated assets
        run: |
          npm run build:assets
          npm run build:css
      - name: Check generated assets are committed
        run: git diff --exit-code -- web/static/css/app.css web/static/vendor
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test navigation lifecycle
        run: npm run test:browser

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t bikesnest .
      - name: Reject an incomplete production environment
        run: |
          set +e
          docker run --rm \
            -e APP_ENV=production \
            -e DATABASE_URL=postgres://x:x@localhost:1/x \
            bikesnest serve
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::the production image accepted an incomplete environment"
            exit 1
          fi
