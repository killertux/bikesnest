# Development stack: `docker compose up` starts the database, the app
# (auto-recompiling via cargo-watch) and the Tailwind CSS watcher.
# DB-only: `docker compose up -d db`.

name: bikesnest

services:
  db:
    image: imresamu/postgis:17-3.5  # arm64-compatible PostGIS build
    container_name: bikesnest-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bikesnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bikesnest}
      POSTGRES_DB: ${POSTGRES_DB:-bikesnest}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - bikesnest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # Rust app, recompiled on change. First start compiles the workspace
  # (several minutes); the named volumes cache the target dir and the cargo
  # registry, so later starts are fast. SQLx compile-time query checking
  # talks to the `db` service.
  app:
    image: rust:1.95
    working_dir: /app
    # PID 1 is `sh`/`cargo watch` here, not the server, so run an init to
    # forward signals and reap children — `docker compose down` then stops the
    # app the same graceful way production does (the release image bakes tini in
    # as its ENTRYPOINT).
    init: true
    # Compose's project-level `.env` normally supplies interpolation values
    # only; it does not automatically put them in a container. Load the whole
    # file so every application config knob reaches Config::from_env. The
    # explicit entries below override only values whose hostnames/paths differ
    # inside the Compose network.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-bikesnest}:${POSTGRES_PASSWORD:-bikesnest}@db:5432/${POSTGRES_DB:-bikesnest}"
      BIND_ADDR: ${COMPOSE_BIND_ADDR:-0.0.0.0:8080}
      RUST_LOG: ${RUST_LOG:-info}
      # Where the development e-mail outbox writes readable messages. Media
      # itself lives in RustFS below; nothing reads this directory for photos.
      MEDIA_ROOT: ${COMPOSE_MEDIA_ROOT:-/app/media}
      # Object storage: RustFS (S3-compatible) for dev. Media is
      # served via direct S3 presigned URLs (no app signing secret).
      S3_ENDPOINT: ${COMPOSE_S3_ENDPOINT:-http://rustfs:9000}
      # Presigned URLs are opened by the host browser, not by this container.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-bikesnest}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      CSP_MEDIA_HOSTS: ${CSP_MEDIA_HOSTS:-http://localhost:9000}
      # Rate limiter: ValKey backend, shared across auth/photo/
      # contribution/moderation. Ephemeral keys (TTL), so no persistence.
      VALKEY_URL: ${COMPOSE_VALKEY_URL:-valkey://valkey:6379}
      # Email: the app uses SMTP in dev, delivering to Mailpit (see below).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: "${EMAIL_FROM:-BikesNest <no-reply@bikesnest.local>}"
      SMTP_HOST: ${COMPOSE_SMTP_HOST:-mailpit}
      SMTP_PORT: "${SMTP_PORT:-1025}"
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    volumes:
      - .:/app
      - cargo-target:/app/target
      - cargo-registry:/usr/local/cargo/registry
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_started
    # NOTE: literal block (|) with the `cargo watch` invocation on ONE physical
    # line. A folded (>) block keeps extra-indented lines as newlines, which in
    # sh would terminate `exec cargo watch` before its flags — cargo-watch would
    # then fall back to its default `cargo check` and never start the server.
    command:
      - sh
      - -c
      - |
        if ! cargo watch --version >/dev/null 2>&1; then echo 'installing cargo-watch (first start only)…'; cargo install --locked cargo-watch; fi
        exec cargo watch -w crates -w migrations -w templates -w Cargo.toml -c -x 'run -q -p bikesnest-web'

  # Tailwind CSS 4.3 watcher: rebuilds web/static/css/app.css as the entry
  # or templates change. node_modules lives in a named volume so the Linux
  # install never clobbers a host-side install.
  #
  # Uses a glibc image (node:24-slim), NOT alpine: Tailwind 4's native `oxide`
  # engine (@tailwindcss/oxide) has no reliable musl build, so on alpine the
  # `tailwindcss` binary crashes on start and the service dies immediately.
  css:
    image: node:24-slim
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    # Tailwind 4's `--watch` exits cleanly when stdin reaches EOF; under
    # `docker compose up -d` there is no terminal, so keep stdin open + a TTY
    # allocated, otherwise the watcher stops the moment it starts.
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "
        (npm ci --no-audit --no-fund || npm install --no-audit --no-fund) &&
        npm run build:assets &&
        npm run watch:css
      "

  # Mailpit (dev): SMTP sink + web UI so every sent email is viewable and
  # auditable. The app (EMAIL_PROVIDER=smtp) delivers here via SMTP_HOST:mailpit.
  mailpit:
    image: axllent/mailpit:latest
    container_name: bikesnest-mailpit
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"   # SMTP relay (what the app connects to)
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"     # web UI: http://localhost:8025

  # ValKey: shared rate-limit store behind the ValKeyRateLimiter
  # (single-node path, VALKEY_URL). Redis-compatible. Ephemeral by design
  # (no persistence — rate-limit keys carry their own TTL), so the data volume is
  # optional and the image is easy to scrape clean.
  valkey:
    image: valkey/valkey:8
    container_name: bikesnest-valkey
    command:
      - "valkey-server"
      - "--port"
      - "6379"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    ports:
      - "${VALKEY_HOST_PORT:-6380}:6379"
    volumes:
      - bikesnest-valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RustFS: S3-compatible object storage for dev media. The app (S3_* env)
  # writes here and serves media via direct presigned URLs. Console at
  # http://localhost:9001/rustfs/console/ (rustfsadmin/rustfsadmin).
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: bikesnest-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${S3_API_HOST_PORT:-9000}:9000"       # S3 API
      - "${S3_CONSOLE_HOST_PORT:-9001}:9001"  # web console
    volumes:
      - bikesnest-rustfs:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket the app writes to (idempotent).
  rustfs-init:
    image: amazon/aws-cli:2.36.47
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-bikesnest}
    command:
      - 'aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3 mb "s3://$$S3_BUCKET"'

  # A real ValKey cluster (cluster path) is optional — see
  # docker-compose.valkey-cluster.yml (single cluster-enabled node covering all
  # slots; portable on Docker Desktop for Mac).

volumes:
  bikesnest-pgdata:
  bikesnest-valkeydata:
  bikesnest-rustfs:
  cargo-target:
  cargo-registry:
  node_modules:
