{% if state == "success" %}
<div class="mt-3 rounded-lg border border-fresh/30 bg-fresh/10 px-4 py-3 text-sm font-medium text-fresh-strong" role="status">
  ✓ {{ label }}
</div>
{% else %}
<div class="mt-3 rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm font-medium text-danger" role="alert">
  {{ label }}
</div>
{% endif %}
