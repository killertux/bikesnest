{% extends "layouts/base.html" %}
{% block content %}
<section class="mx-auto max-w-shell px-4 py-12 lg:px-8">
  <div class="max-w-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">{{ tr.t("account.pw_title") }}</h1>
    {% if notice.is_some() %}
      <div class="mt-4 rounded-lg border border-fresh/30 bg-fresh/10 px-4 py-3 text-sm text-fresh-strong">{{ notice.as_deref().unwrap_or("") }}</div>
    {% endif %}
    {% if error.is_some() %}
      <div class="mt-4 rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">{{ error.as_deref().unwrap_or("") }}</div>
    {% endif %}
    <form action="/account/password" method="post" class="mt-6 space-y-4">
      <input type="hidden" name="csrf" value="{{ layout.csrf }}" />
      <div>
        <label for="current_password" class="mb-1 block text-sm font-medium">{{ tr.t("account.pw_current") }}</label>
        <input id="current_password" name="current_password" type="password" required autocomplete="current-password" class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-fg outline-none focus:border-accent" />
      </div>
      <div>
        <label for="new_password" class="mb-1 block text-sm font-medium">{{ tr.t("account.pw_new") }}</label>
        <input id="new_password" name="new_password" type="password" required minlength="8" autocomplete="new-password" class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-fg outline-none focus:border-accent" />
      </div>
      <button type="submit" class="rounded-lg bg-accent-strong px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-accent-dark">{{ tr.t("account.pw_submit") }}</button>
      <a href="/account" class="ml-3 text-sm text-muted hover:text-fg">{{ tr.t("account.back") }}</a>
    </form>
  </div>
</section>
{% endblock %}
